# A cada push na main: roda os testes e, se passarem, publica na VPS.
# Segredos: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST.
name: Testes e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - run: pip install -r gateway/requirements.txt
      - name: Testes do gateway
        working-directory: gateway
        run: python -m pytest -q

  # Só publica se os segredos da VPS estiverem configurados (forks e repositório recém-criado pulam).
  configurado:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: echo "ok=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [testes, configurado]
    if: needs.configurado.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Monta as imagens
        run: |
          docker build -t consulta-rtc-calculadora:latest calculadora
          docker build --build-context calc=docker-image://consulta-rtc-calculadora:latest \
            -t consulta-rtc-calculadora-sn:latest calculadora-sn
          docker build -t consulta-rtc-danfse:latest danfse
          docker build --build-context calc=docker-image://consulta-rtc-calculadora:latest \
            -t consulta-rtc-gateway:latest -t consulta-rtc-gateway:${{ github.sha }} -f gateway/Dockerfile .

      - name: Acesso SSH à VPS
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n' "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config

      - name: Envia as imagens e a configuração
        run: |
          docker save consulta-rtc-calculadora:latest consulta-rtc-calculadora-sn:latest consulta-rtc-danfse:latest consulta-rtc-gateway:latest consulta-rtc-gateway:${{ github.sha }} | gzip -1 | ssh vps 'gunzip | docker load'
          ssh vps 'mkdir -p ~/consulta-rtc'
          scp deploy/docker-compose.yml deploy/Caddyfile vps:consulta-rtc/

      - name: Reinicia o site
        run: |
          ssh vps 'cd ~/consulta-rtc && docker compose up -d --remove-orphans && docker image prune -f && install -m 644 Caddyfile /opt/proxy/sites/consulta-rtc.caddy && docker exec proxy-caddy-1 caddy reload --config /etc/caddy/Caddyfile'
          ssh vps 'for i in $(seq 1 60); do if [ "$(docker compose -f ~/consulta-rtc/docker-compose.yml ps --format "{{.Health}}" | grep -c healthy)" = "4" ]; then docker images consulta-rtc-gateway --format "{{.Tag}}" | grep -v "^latest$" | tail -n +3 | xargs -r -I{} docker rmi consulta-rtc-gateway:{} >/dev/null; exit 0; fi; sleep 4; done; docker compose -f ~/consulta-rtc/docker-compose.yml logs --tail 50; exit 1'

      - name: Confere o site no ar (teste de fumaça em produção)
        run: |
          for i in $(seq 1 30); do curl -sf https://rtc.giovannicuchiaro.com/api/saude > /dev/null && break; sleep 3; done
          sleep 10
          bash scripts/teste-fumaca.sh https://rtc.giovannicuchiaro.com
